<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보통 체형 · 타격에서 1루까지</title><link rel="stylesheet" href="preview.css"></head>
<body><main>
<header><div><span class="eyebrow">해체해라 · 동작 미리보기</span><h1>보통 체형, 타격에서 1루까지</h1></div><p>새 뼈대 · 기본 타격폼 · 얼굴/머리카락 파츠 적용 전</p></header>
<div class="arena"><canvas id="scene" width="1672" height="941" role="img" aria-label="새 보통 체형 선수가 서기부터 타격 후 1루까지 뛰고 감속하는 장면"></canvas><div id="loading">경기장과 동작 그림을 불러오는 중…</div><div class="scene-label"><span id="cameraName">낮은 공격 시점</span><b id="phaseName">서기</b></div></div>
<div class="transport"><label>상황 <select id="scenario"><option value="safe">주자가 먼저 도착</option><option value="out">송구가 먼저 도착</option></select></label><button id="play" class="primary" type="button">▶ 재생</button><button id="restart" type="button">처음부터</button><label class="scrub"><span id="clock">0.0 / 11.6초</span><input id="timeline" type="range" min="0" max="1160" step="1" value="0" aria-label="재생 위치"></label><label>속도 <select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label><label>카메라 <select id="camera"><option value="auto">자동 전환</option><option value="high">높은 시점 고정</option></select></label><label class="loop"><input id="loop" type="checkbox"> 반복</label></div>
<nav id="steps" aria-label="동작 단계"></nav>
<footer><p id="detail">서기에서 시작해, 타격하고 1루를 밟은 뒤 감속합니다.</p><div class="exports"><button id="sheet" type="button">8단계 그림 저장</button><button id="video" type="button">영상 저장</button></div></footer>
<p class="note">1루 포구·송구와 주자 도착 순서를 비교하는 독립 시안입니다. 도착한 주자는 베이스를 밟고 대기합니다. 실제 구단의 경기 판정은 변경하지 않습니다.</p>
</main><script src="race.js"></script><script src="preview.js"></script></body></html>
