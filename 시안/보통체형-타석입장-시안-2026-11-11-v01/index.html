<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보통 체형 · 타석 입장</title><link rel="stylesheet" href="preview.css"></head><body><main>
<header><div><span class="eyebrow">해체해라 · 타자 등장 미리보기</span><h1>홈팀은 오른쪽 · 원정팀은 왼쪽에서</h1></div><p>보통 체형 우타자 · 얼굴·머리카락 적용 전</p></header>
<div class="arena"><canvas id="scene" width="1672" height="941" role="img" aria-label="홈팀은 화면 오른쪽, 원정팀은 화면 왼쪽에서 걸어와 타석에서 돌아서고 준비하는 장면"></canvas><div id="loading">입장 동작을 불러오는 중…</div><div class="scene-label"><span id="sideName">홈팀 · 오른쪽 입장</span><b id="phaseName">등장</b></div></div>
<div class="transport"><label>팀 <select id="team"><option value="home">홈팀 · 오른쪽</option><option value="away">원정팀 · 왼쪽</option></select></label><label>흐름 <select id="mode"><option value="entry">입장·준비만</option><option value="full" selected>타격·1루까지</option></select></label><button id="play" class="primary">▶ 재생</button><button id="restart">처음부터</button><label class="scrub"><span id="clock"></span><input id="timeline" type="range" min="0" max="2000" value="0" step="1" aria-label="재생 위치"></label><label>속도 <select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label><button id="skip">준비 자세로</button><label class="loop"><input id="loop" type="checkbox">반복</label></div>
<nav id="steps" aria-label="동작 단계"></nav><footer><p id="detail">화면 가장자리에서 걸어와 타석에 자리 잡습니다.</p><div class="exports"><button id="sheet">분할 동작 저장</button><button id="video">영상 저장</button></div></footer><p class="note">같은 보통 체형과 임시 유니폼으로 입장 방향을 비교합니다. 우타자 기본형이며, 준비 뒤에는 기존 타격·1루 세이프 장면으로 이어집니다.</p>
</main><script src="continuation-data.js"></script><script src="preview.js"></script></body></html>
