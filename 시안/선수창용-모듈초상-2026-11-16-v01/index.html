<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해체해라 · 선수창용 모듈 초상</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1c24;color:#e7eee9;font:15px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}p{color:#a9bdbb}header{padding-bottom:20px;border-bottom:1px solid #34504f}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:20px 0}label{display:grid;gap:5px;font-size:12px;color:#b3c9c4}select,button{background:#18372f;color:#fff;border:1px solid #486a5d;border-radius:7px;padding:9px;font:inherit}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:14px}.card{padding:14px 8px;text-align:center;background:#122c31;border:1px solid #294b4d;border-radius:12px}.card canvas{width:145px;height:181px;image-rendering:pixelated;background:linear-gradient(#1c4c45,#102e2e);border-radius:6px}.mini canvas{width:48px;height:64px;border-radius:4px}.mini{display:flex;justify-content:center;gap:8px;padding-top:12px}.caption{color:#8eaaa6;font-size:12px}.checks{padding:20px;background:#10282e;margin-top:24px;border-radius:12px}#compare{display:flex;gap:22px;align-items:end;flex-wrap:wrap}#compare canvas{image-rendering:pixelated}output{color:#f0d68e}body.light .card{background:#e3e3dc;color:#18382f}body.light .card canvas{background:#f7f3e9}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){main{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}}
</style><main><header><p>해체해라 · 캐릭터 제작 01</p><h1>선수창용 모듈 초상</h1><p>상세창은 상반신, 작은 카드는 같은 얼굴의 확대 컷. 아래 선택값은 모든 체형에 동일하게 적용됩니다.</p></header>
<div class="controls"><label>피부색<select id="skin"></select></label><label>눈동자색<select id="eyeColor"></select></label><label>머리색<select id="hairColor"></select></label><label>머리카락<select id="hair"></select></label><label>얼굴 조합<select id="face"><option value="0">균형 잡힌 얼굴</option><option value="1">온화한 얼굴</option><option value="2">또렷한 얼굴</option></select></label><label>장비<select id="gear"><option value="none">없음</option><option value="cap">모자</option><option value="helmet">헬멧</option><option value="glasses">안경</option><option value="sun">선글라스</option><option value="patch">아이패치</option></select></label><label>수염<select id="beard"></select></label><button id="background">밝은 바탕</button></div>
<section id="grid" class="grid"></section><section class="checks"><h2>같은 선수, 다른 표시 크기</h2><div id="compare"></div><p id="status">이미지를 준비합니다…</p><output id="qa"></output></section></main>
<script src="../../구현/해체해라-2026-10-07-v01/src/portrait-assets-v13.js"></script>
<script>for(const a of Object.values(PORTRAIT_ASSETS_V13))a.uri='../../구현/해체해라-2026-10-07-v01/'+a.uri;</script>
<script src="../../구현/해체해라-2026-10-07-v01/src/portrait-renderer-v13.js"></script>
<script>
const R=PortraitRendererV13,$=id=>document.getElementById(id);
const labels={skin:['밝은 살구','살구','구릿빛','갈색','짙은 갈색','깊은 갈색'],eyeColor:['흑갈색','갈색','파랑','초록','호박색','회색'],hairColor:['갈흑색','검정','갈색','적갈색','금발','회색','붉은 갈색'],hair:['짧은 머리','옆가르마','귀 길이','목덜미 길이','장발','웨이브','낮은 묶음'],beard:['턱수염','턱선','전체 짧게','전체 풍성하게','콧수염과 턱수염']};
for(const [id,list]of Object.entries(labels)){if(id==='hair'||id==='beard')$(id).add(new Option('없음',-1));list.forEach((n,i)=>$(id).add(new Option(n,i)));} $('hair').value=1;$('hairColor').value=2;
const combos=[{eyes:0,brows:1,nose:0,mouth:0},{eyes:2,brows:4,nose:3,mouth:1},{eyes:3,brows:3,nose:4,mouth:4}];
function config(body=2){const gear=$('gear').value;return{body,skin:+$('skin').value,eyeColor:+$('eyeColor').value,hairColor:+$('hairColor').value,headwear:['cap','helmet'].includes(gear)?gear:null,eyePatch:gear==='patch',parts:{...combos[$('face').value],hair:+$('hair').value,beard:+$('beard').value,wear:gear==='glasses'?0:gear==='sun'?4:-1,black:-1}};}
function portrait(a,small=false){const out=R.render(a),c=document.createElement('canvas');c.width=small?72:128;c.height=small?96:160;const g=c.getContext('2d');g.imageSmoothingEnabled=false;small?g.drawImage(out.canvas,...out.crop,0,0,72,96):g.drawImage(out.canvas,0,0);return c;}
function draw(){ $('grid').innerHTML='';for(const b of [2,5,4,3,1,0]){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=R.bodyNames[b];card.append(h,portrait(config(b)));const mini=document.createElement('div');mini.className='mini';mini.append(portrait(config(b),true));card.append(mini);$('grid').append(card);}const compare=$('compare');compare.innerHTML='';const c=portrait(config());c.style.width='256px';c.style.height='320px';compare.append(c,portrait(config(),true));$('status').textContent='머리·몸·눈·눈썹·코·입·머리카락·장비를 따로 조합 · 실제 상세창 폭 145px / 작은 카드 48px';}
document.querySelectorAll('select').forEach(s=>s.addEventListener('change',draw));$('background').onclick=()=>document.body.classList.toggle('light');
R.init().then(()=>{draw();window.previewReady=true;});window.previewConfig=config;
</script></html>
